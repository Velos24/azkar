<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الثعبان</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-board" width="400" height="400"></canvas>
        <div id="start-screen" class="screen">
            <h1>لعبة الثعبان</h1>
            <button id="start-btn">ابدأ اللعب</button>
            <button id="options-btn">الخيارات</button>
        </div>
        <div id="options-screen" class="screen" style="display: none;">
            <h2>الخيارات</h2>
            <div class="option">
                <label for="difficulty">مستوى الصعوبة:</label>
                <select id="difficulty">
                    <option value="easy">سهل</option>
                    <option value="medium">متوسط</option>
                    <option value="hard">صعب</option>
                </select>
            </div>
            <button id="back-to-menu-btn">العودة</button>
        </div>
        <div id="game-over-screen" class="screen" style="display: none;">
            <h2>انتهت اللعبة!</h2>
            <p>النتيجة: <span id="final-score">0</span></p>
            <button id="play-again-btn">إعادة اللعب</button>
        </div>
        <div id="score">النتيجة: 0</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
